<div
    class="task-item"
    [class.completed]="task.completed"
    [class.removing]="isRemoving"
>
    <label class="task-checkbox">
        <input type="checkbox" [checked]="task.completed" (change)="onToggle()">
        <span class="checkmark">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </span>
    </label>

    @if (isEditing) {
        <input
            type="text"
            class="task-edit-input"
            #editInput
            [(ngModel)]="editText"
            (keydown)="onEditKeydown($event)"
            (blur)="saveEdit()"
            maxlength="200"
        >
    } @else {
        <span class="task-text">{{ task.text }}</span>
        <div class="task-actions">
            <button class="action-btn edit-btn" (click)="startEdit()" aria-label="Edit task">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
            </button>
            <button class="action-btn delete-btn" (click)="onDelete()" aria-label="Delete task">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            </button>
        </div>
    }
</div>
